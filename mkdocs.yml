site_name: Bugsy
site_description: Anthony Coffey's personal AI agent stack — architecture, workflows, operations.
site_author: Anthony Coffey
copyright: Internal docs — not for public consumption.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - DDD:
      - Overview: README.md
      - Summary (TOC): SUMMARY.md
      - Development Standards: documentation/development-standards.md
      - Documentation Index: documentation/README.md
  - Architecture:
      - architecture/overview.md
      - architecture/networking.md
      - architecture/credentials.md
  - Workflows:
      - workflows/bugsy-unified.md
      - workflows/job-board.md
      - workflows/rag-ingest.md
      - workflows/rag-query.md
      - workflows/bugsy-inbox-watcher.md
      - workflows/bugsy-jira-digest.md
      - workflows/bugsy-leads-hunter.md
      - workflows/bugsy-research.md
  - Operations:
      - operations/deploy.md
      - operations/n8n-import.md
      - operations/workflow-reference-generator.md
      - operations/troubleshooting.md
  - Reference:
      - reference/env-vars.md
      - reference/webhooks.md
      - reference/database.md
  - Templates:
      - templates/feature-template.md
      - templates/bug-template.md
      - templates/adr-template.md
      - templates/agent-brief-template.md
