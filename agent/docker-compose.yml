# Agent stack — docker-compose.
#
# Originally laid down by Terraform's cloud-init as a "data + model" foundation.
# Open WebUI is wired in. Still to add: n8n, Caddy, Langfuse, MCP servers.

name: agent

networks:
  agent-net:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  ollama-data:
  openwebui-data:

services:
  # ---------- Data layer ----------

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [agent-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [agent-net]

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [agent-net]

  # ---------- Model layer ----------

  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [agent-net]
    # Uncomment the deploy block when you add a GPU and the NVIDIA
    # Container Toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agent-litellm
    restart: unless-stopped
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      LITELLM_MASTER_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [agent-net]
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- UI layer ----------

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agent-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - openwebui-data:/app/backend/data
    networks: [agent-net]
    depends_on: [litellm, qdrant]
