# Agent stack — docker-compose.
#
# Originally laid down by Terraform's cloud-init as a "data + model" foundation.
# Phase 1 wires in n8n + Cloudflare Tunnel + SearXNG (web search for Bugsy).
# Still to add: Langfuse, MCP servers.

name: agent

networks:
  agent-net:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  ollama-data:
  openwebui-data:
  n8n-data:
  searxng-data:
  evolution-data:

services:
  # ---------- Data layer ----------

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    networks: [agent-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [agent-net]

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [agent-net]

  # ---------- Model layer ----------

  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [agent-net]
    # Uncomment the deploy block when you add a GPU and the NVIDIA
    # Container Toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agent-litellm
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./litellm/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      LITELLM_MASTER_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [agent-net]
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- UI layer ----------

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agent-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - openwebui-data:/app/backend/data
    networks: [agent-net]
    depends_on: [litellm, qdrant]

  # ---------- Workflow layer ----------

  n8n:
    image: n8nio/n8n:latest
    container_name: agent-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${TZ}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "1024"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      NODE_FUNCTION_ALLOW_EXTERNAL: axios
      LITELLM_KEY: ${WEBUI_SECRET_KEY}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [agent-net]
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- WhatsApp gateway ----------
  #
  # Evolution API — self-hosted WhatsApp gateway (wraps Baileys / WhatsApp Web).
  # Internal-only by default; n8n calls it at http://evolution-api:8080.
  # Expose externally via Cloudflare Tunnel only when you need to scan a QR
  # or manage instances from the browser. Persists session state in postgres
  # (database `evolution`) and uses redis db 6 as a cache.

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: agent-evolution-api
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://${EVOLUTION_HOST}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Bugsy
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      LANGUAGE: en
      DEL_INSTANCE: "false"
      TELEMETRY: "false"
    volumes:
      - evolution-data:/evolution/instances
    networks: [agent-net]
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Ingress layer ----------

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agent-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    networks: [agent-net]
    depends_on: [n8n, evolution-api]

  # ---------- Search layer ----------
  #
  # SearXNG — self-hosted metasearch. Bugsy queries it for prospect research
  # and any other "search the web" task. Internal-only; no public exposure.
  # Query via http://searxng:8080/search?q=...&format=json from other services.

  searxng:
    image: searxng/searxng:latest
    container_name: agent-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - searxng-data:/var/cache/searxng
      - type: bind
        source: ./searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
        bind:
          create_host_path: false
    networks: [agent-net]
