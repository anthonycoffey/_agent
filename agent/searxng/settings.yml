# SearXNG settings for the Bugsy stack.
#
# Internal-only metasearch — never exposed via cloudflared. Other services
# in the agent network query it as http://searxng:8080.
#
# JSON output is enabled (off by default in SearXNG) so the n8n HTTP Request
# node can consume responses directly.
#
# Secret key is read from SEARXNG_SECRET env var (set in .env).

use_default_settings: true

general:
  debug: false
  instance_name: "Bugsy Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: false
  limiter: false        # internal traffic only; rate limiting unnecessary
  public_instance: false
  image_proxy: false
  http_protocol_version: "1.0"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: true
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: auto

# Engines: keep a sensible mix that doesn't get rate-limited often. Tweak as
# needed once we see what works for prospect research traffic patterns.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
  - name: github
    disabled: false
  - name: hackernews
    disabled: false
  - name: wikipedia
    disabled: false
