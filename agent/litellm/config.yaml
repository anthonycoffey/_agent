# LiteLLM proxy config.
# Exposes a unified OpenAI-compatible API in front of hosted + local models.
# Apps point at http://litellm:4000/v1 with WEBUI_SECRET_KEY as the bearer.

model_list:
  # ---- Hosted: Anthropic ----
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Hosted: OpenAI (kept available for tooling that needs it) ----
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ---- Hosted: Google Gemini ----
  # Pro for synthesis-heavy work (research briefs, long-context tasks).
  # Flash for fast/cheap classification, summaries, agent loops.
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ---- Local: Ollama ----
  - model_name: qwen3
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://ollama:11434

  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
